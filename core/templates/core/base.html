{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Vehicle Marketplace{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header class="site-header">
    <div class="header-inner">
        <h1>
            <a href="{% url 'products:product_list' %}">Vehicle Marketplace</a>
        </h1>

        <div class="header-right">
            <form method="get" action="{% url 'products:product_list' %}" class="header-search">
                <input type="search" name="q" placeholder="Search vehicles...">
                <button type="submit">Search</button>
            </form>

            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="auth-button">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="auth-button">Login</a>
            {% endif %}
        </div>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <p>&copy; 2026 Vehicle Marketplace</p>
</footer>

</body>
</html>
