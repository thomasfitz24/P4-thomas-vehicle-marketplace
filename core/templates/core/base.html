{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Vehicle Marketplace{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header>
    <h1>
        <a href="{% url 'products:product_list' %}">
            Vehicle Marketplace
        </a>
    </h1>

    <nav>
        {% if user.is_authenticated %}
            <span>Welcome, {{ user.username }}</span>
            {% if user.is_staff %}
                | <a href="/admin/">Admin</a>
            {% endif %}
            | <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>

    <hr>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <hr>
    <p>&copy; 2026 Vehicle Marketplace</p>
</footer>

</body>
</html>
